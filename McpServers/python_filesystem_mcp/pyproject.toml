[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-mcp-python"
version = "1.19.1"
description = "Python refactor of the secure filesystem MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
filesystem-mcp = "filesystem_mcp.cli:main"
filesystem-mcp-python = "filesystem_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["filesystem_mcp*"]
