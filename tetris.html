<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .game-container {
        background: #16213e;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        display: flex;
        gap: 30px;
        align-items: flex-start;
    }
    .board-section {
        text-align: center;
    }
    .board-section h2 {
        color: #e94560;
        margin-bottom: 12px;
        font-size: 24px;
        letter-spacing: 2px;
    }
    #board {
        display: grid;
        grid-template-columns: repeat(10, 30px);
        grid-template-rows: repeat(20, 30px);
        border: 3px solid #e94560;
        border-radius: 4px;
        background: #0f3460;
        gap: 1px;
    }
    .cell {
        width: 30px;
        height: 30px;
        background: #1a1a3e;
        border-radius: 2px;
        transition: background 0.08s;
    }
    .cell.filled { border: 1px solid rgba(255,255,255,0.2); }
    .side-panel {
        display: flex;
        flex-direction: column;
        gap: 25px;
        min-width: 130px;
    }
    .info-box {
        background: #0f3460;
        border-radius: 10px;
        padding: 16px;
        text-align: center;
        border: 2px solid #533483;
    }
    .info-box h3 {
        color: #e94560;
        font-size: 14px;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .info-box .value {
        color: #fff;
        font-size: 28px;
        font-weight: bold;
    }
    #next-box {
        display: grid;
        grid-template-columns: repeat(4, 24px);
        grid-template-rows: repeat(4, 24px);
        gap: 1px;
        margin: 8px auto 0;
        width: fit-content;
    }
    .mini-cell {
        width: 24px;
        height: 24px;
        background: #1a1a3e;
        border-radius: 2px;
    }
    .mini-cell.filled-mini { border: 1px solid rgba(255,255,255,0.15); }
    .controls {
        margin-top: 12px;
        color: #aaa;
        font-size: 12px;
        line-height: 1.8;
    }
    .controls kbd {
        background: #533483;
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
    }
    #game-over-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75);
        border-radius: 4px;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 14px;
        z-index: 10;
    }
    #game-over-overlay.show {
        display: flex;
    }
    #game-over-overlay h1 {
        color: #e94560;
        font-size: 32px;
        letter-spacing: 3px;
    }
    #game-over-overlay button {
        background: #e94560;
        color: #fff;
        border: none;
        padding: 10px 28px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
    }
    #game-over-overlay button:hover { background: #c73652; }
    .board-wrapper { position: relative; display: inline-block; }
</style>
</head>
<body>
<div class="game-container">
    <div class="board-section">
        <h2>TETRIS</h2>
        <div class="board-wrapper">
            <div id="board"></div>
            <div id="game-over-overlay">
                <h1>GAME OVER</h1>
                <button onclick="restartGame()">다시 시작</button>
            </div>
        </div>
    </div>
    <div class="side-panel">
        <div class="info-box">
            <h3>SCORE</h3>
            <div class="value" id="score-display">0</div>
        </div>
        <div class="info-box">
            <h3>LINES</h3>
            <div class="value" id="lines-display">0</div>
        </div>
        <div class="info-box">
            <h3>NEXT</h3>
            <div id="next-box"></div>
        </div>
        <div class="controls">
            <kbd>←</kbd> <kbd>→</kbd> 이동<br>
            <kbd>↑</kbd> 회전<br>
            <kbd>↓</kbd> 아래 이동<br>
            <kbd>Space</kbd> 하드 드롭
        </div>
    </div>
</div>
<script>
// ---- 테트리스 블록 데이터 (7가지) ----
const SHAPES = {
    I: { blocks: [[1,1,1,1]], color: '#00f0f0' },
    O: { blocks: [[1,1],[1,1]], color: '#f0f000' },
    T: { blocks: [[0,1,0],[1,1,1]], color: '#a000f0' },
    S: { blocks: [[0,1,1],[1,1,0]], color: '#00f000' },
    Z: { blocks: [[1,1,0],[0,1,1]], color: '#f00000' },
    J: { blocks: [[1,0,0],[1,1,1]], color: '#0000f0' },
    L: { blocks: [[0,0,1],[1,1,1]], color: '#f0a000' }
};
const SHAPE_NAMES = Object.keys(SHAPES);

// ---- 게임 상태 ----
const COLS = 10;
const ROWS = 20;
let board = [];
let currentPiece = null;
let nextPiece = null;
let score = 0;
let lines = 0;
let gameOver = false;
let fallInterval = null;
const BASE_INTERVAL = 500;

// ---- DOM 참조 ----
const boardEl = document.getElementById('board');
const nextBoxEl = document.getElementById('next-box');
const scoreDisplay = document.getElementById('score-display');
const linesDisplay = document.getElementById('lines-display');
const overlay = document.getElementById('game-over-overlay');

// ---- 초기화 ----
function createEmptyBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function getRandomPiece() {
    const name = SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
    const shape = SHAPES[name];
    return {
        name,
        blocks: shape.blocks.map(row => [...row]),
        color: shape.color
    };
}

function spawnNewPiece() {
    if (!nextPiece) {
        nextPiece = getRandomPiece();
    }
    const piece = {
        ...nextPiece,
        blocks: nextPiece.blocks.map(row => [...row]),
        x: Math.floor((COLS - nextPiece.blocks[0].length) / 2),
        y: 0
    };
    nextPiece = getRandomPiece();
    drawNextPiece();
    return piece;
}

// ---- 회전 (시계 방향) ----
function rotateBlocks(blocks) {
    const rows = blocks.length;
    const cols = blocks[0].length;
    const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            rotated[c][rows - 1 - r] = blocks[r][c];
        }
    }
    return rotated;
}

// ---- 충돌 검사 ----
function isValid(blocks, offsetX, offsetY) {
    for (let r = 0; r < blocks.length; r++) {
        for (let c = 0; c < blocks[0].length; c++) {
            if (!blocks[r][c]) continue;
            const bx = offsetX + c;
            const by = offsetY + r;
            if (bx < 0 || bx >= COLS || by >= ROWS) return false;
            if (by < 0) continue;
            if (board[by][bx] !== null) return false;
        }
    }
    return true;
}

// ---- 조각 고정 ----
function lockPiece() {
    const p = currentPiece;
    if (!p) return;
    for (let r = 0; r < p.blocks.length; r++) {
        for (let c = 0; c < p.blocks[0].length; c++) {
            if (!p.blocks[r][c]) continue;
            const by = p.y + r;
            const bx = p.x + c;
            if (by < 0) {
                triggerGameOver();
                return;
            }
            board[by][bx] = p.color;
        }
    }
    clearFullLines();
    currentPiece = spawnNewPiece();
    if (!isValid(currentPiece.blocks, currentPiece.x, currentPiece.y)) {
        triggerGameOver();
    }
    render();
}

// ---- 라인 제거 ----
function clearFullLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== null)) {
            board.splice(r, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            r++;
        }
    }
    if (cleared > 0) {
        const points = [0, 100, 300, 500, 800];
        score += points[Math.min(cleared, 4)];
        lines += cleared;
        updateInfo();
    }
}

// ---- 이동 / 회전 ----
function movePiece(dx, dy) {
    if (gameOver || !currentPiece) return false;
    if (isValid(currentPiece.blocks, currentPiece.x + dx, currentPiece.y + dy)) {
        currentPiece.x += dx;
        currentPiece.y += dy;
        render();
        return true;
    }
    if (dy === 1) {
        lockPiece();
        render();
    }
    return false;
}

function rotatePiece() {
    if (gameOver || !currentPiece) return;
    const rotated = rotateBlocks(currentPiece.blocks);
    if (isValid(rotated, currentPiece.x, currentPiece.y)) {
        currentPiece.blocks = rotated;
        render();
    } else {
        for (const kick of [-1, 1, -2, 2]) {
            if (isValid(rotated, currentPiece.x + kick, currentPiece.y)) {
                currentPiece.blocks = rotated;
                currentPiece.x += kick;
                render();
                return;
            }
        }
    }
}

function hardDrop() {
    if (gameOver || !currentPiece) return;
    while (isValid(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
    }
    lockPiece();
    render();
}

// ---- 렌더링 ----
function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const color = board[r][c];
            if (color) {
                cell.style.background = color;
                cell.classList.add('filled');
            }
            boardEl.appendChild(cell);
        }
    }
    if (currentPiece && !gameOver) {
        const p = currentPiece;
        for (let r = 0; r < p.blocks.length; r++) {
            for (let c = 0; c < p.blocks[0].length; c++) {
                if (!p.blocks[r][c]) continue;
                const by = p.y + r;
                const bx = p.x + c;
                if (by < 0 || by >= ROWS || bx < 0 || bx >= COLS) continue;
                const idx = by * COLS + bx;
                const cell = boardEl.children[idx];
                if (cell) {
                    cell.style.background = p.color;
                    cell.classList.add('filled');
                }
            }
        }
    }
}

function drawNextPiece() {
    nextBoxEl.innerHTML = '';
    const blocks = nextPiece.blocks;
    const color = nextPiece.color;
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            const cell = document.createElement('div');
            cell.className = 'mini-cell';
            if (blocks[r] && blocks[r][c]) {
                cell.style.background = color;
                cell.classList.add('filled-mini');
            }
            nextBoxEl.appendChild(cell);
        }
    }
}

function updateInfo() {
    scoreDisplay.textContent = score;
    linesDisplay.textContent = lines;
}

// ---- 게임 오버 ----
function triggerGameOver() {
    if (gameOver) return;
    gameOver = true;
    clearInterval(fallInterval);
    fallInterval = null;
    overlay.classList.add('show');
}

// ---- 게임 시작 / 재시작 ----
function restartGame() {
    overlay.classList.remove('show');
    board = createEmptyBoard();
    score = 0;
    lines = 0;
    gameOver = false;
    updateInfo();
    nextPiece = getRandomPiece();
    currentPiece = spawnNewPiece();
    render();
    startFallInterval();
}

function startFallInterval() {
    if (fallInterval) clearInterval(fallInterval);
    fallInterval = setInterval(() => {
        if (!gameOver && currentPiece) {
            movePiece(0, 1);
        }
    }, BASE_INTERVAL);
}

// ---- 키보드 이벤트 ----
document.addEventListener('keydown', (e) => {
    if (gameOver) {
        if (e.key === 'Enter' || e.key === ' ') {
            restartGame();
        }
        return;
    }
    switch (e.key) {
        case 'ArrowLeft':  movePiece(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': movePiece(1, 0);  e.preventDefault(); break;
        case 'ArrowDown':  movePiece(0, 1);  e.preventDefault(); break;
        case 'ArrowUp':    rotatePiece();     e.preventDefault(); break;
        case ' ':          hardDrop();        e.preventDefault(); break;
    }
});

// ---- 최초 시작 ----
restartGame();
</script>
</body>
</html>
